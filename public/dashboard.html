<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RicozFinancials — Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">R</span>
        <span class="brand-name">RicozFinancials</span>
      </div>
      <nav>
        <a href="#overview" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="#accounts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          Management accounts
        </a>
        <a href="#reporting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 3 21 8 12 13 3 8"/><polyline points="3 14 12 19 21 14"/></svg>
          Consolidated reporting
        </a>
        <a href="#board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
          Board reports
        </a>
      </nav>
      <p class="sidebar-foot">&copy; 2026 RicozFinancials</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2>Overview</h2>
        <div class="user-box">
          <span id="userName"></span>
          <button class="logout-btn" id="logoutBtn">Log out</button>
        </div>
      </header>

      <main class="dashboard">
        <section id="overview">
          <div class="kpi-grid" id="kpiGrid"></div>
        </section>

        <section id="accounts">
          <h3>Management accounts — by entity</h3>
          <div class="card">
            <table class="entity-table" id="entityTable">
              <thead><tr><th>Entity</th><th>Revenue</th><th>Profit</th><th>Status</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section id="reporting">
          <h3>Consolidated revenue trend</h3>
          <div class="card">
            <canvas id="revenueChart" height="80"></canvas>
          </div>
        </section>

        <section id="board">
          <h3>Board &amp; executive summary</h3>
          <div class="card">
            <ul class="board-list" id="boardSummary"></ul>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
